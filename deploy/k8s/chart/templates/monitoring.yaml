apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-prometheus
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-prometheus
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-monitoring
data:
  prometheus.yaml: |
    {{- tpl (.Files.Get "files/prometheus.yaml") . | nindent 4 }}
  datasource.yaml: |
    {{- tpl (.Files.Get "files/grafana-datasource.yaml") . | nindent 4 }}
  provider.yaml: |
    {{- .Files.Get "files/grafana-provider.yaml" | nindent 4 }}
  dashboard.json: |
    {{- .Files.Get "files/dashboard.json" | nindent 4 }}
{{- range $role := list "prometheus" "grafana" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $role }}
spec:
  selector: {app: {{ $.Release.Name }}-{{ $role }}}
  ports:
    - name: http
      port: {{ if eq $role "prometheus" }}9090{{ else }}3000{{ end }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $role }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ $.Release.Name }}-{{ $role }}}
  template:
    metadata:
      labels: {app: {{ $.Release.Name }}-{{ $role }}}
      annotations:
        checksum/config: {{ ($.Files.Glob "files/*").AsConfig | sha256sum | quote }}
    spec:
      {{- if eq $role "prometheus" }}
      serviceAccountName: {{ $.Release.Name }}-prometheus
      securityContext: {runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534}
      {{- else }}
      securityContext: {runAsUser: 472, runAsGroup: 472, fsGroup: 472}
      {{- end }}
      containers:
        - name: {{ $role }}
          {{- if eq $role "prometheus" }}
          image: {{ $.Values.monitoring.prometheusImage }}
          args:
            - --config.file=/etc/prometheus/prometheus.yaml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ $.Values.monitoring.retention }}
          {{- else }}
          image: {{ $.Values.monitoring.grafanaImage }}
          env:
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.postgres.existingSecret }}
                  key: GF_SECURITY_ADMIN_PASSWORD
          {{- end }}
          ports:
            - {name: http, containerPort: {{ if eq $role "prometheus" }}9090{{ else }}3000{{ end }}}
          readinessProbe:
            httpGet: {path: {{ if eq $role "prometheus" }}/-/ready{{ else }}/api/health{{ end }}, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            {{- if eq $role "prometheus" }}
            - {name: data, mountPath: /prometheus}
            - {name: config, mountPath: /etc/prometheus/prometheus.yaml, subPath: prometheus.yaml}
            {{- else }}
            - {name: data, mountPath: /var/lib/grafana}
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml}
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/provider.yaml, subPath: provider.yaml}
            - {name: config, mountPath: /var/lib/grafana/dashboards/dashboard.json, subPath: dashboard.json}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ $.Release.Name }}-monitoring}
        - name: data
          persistentVolumeClaim: {claimName: {{ $.Release.Name }}-{{ $role }}}
{{- end }}
