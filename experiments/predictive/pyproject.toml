[project]
name = "streamscale-predictive-preparation"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ax-platform==1.1.2", "streamscale-console", "torch==2.8.0+cpu"]

[tool.uv.sources]
streamscale-console = { path = "../../console", editable = true }

[tool.uv]
# Keep Bayesian preparation CPU-only; CUDA packages are unnecessary here.
index = [{ name = "pytorch-cpu", url = "https://download.pytorch.org/whl/cpu", explicit = true }]

[tool.uv.sources.torch]
index = "pytorch-cpu"
